<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martwin · ASCII explorer designs (proposal)</title>
<style>
body{margin:0;background:#101214;color:#aaa9a3;font:13px system-ui,sans-serif;padding:40px 24px}
.row{display:flex;align-items:flex-end;justify-content:center;gap:34px;flex-wrap:wrap}
pre{margin:0;font:14px/1.1 ui-monospace,Menlo,monospace;white-space:pre;text-shadow:0 0 4px rgba(241,238,231,.35)}
.ground{font:14px/1.1 ui-monospace,Menlo,monospace;color:#c96f3e;white-space:pre;overflow:hidden;text-align:center;margin:0}
.labels{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body>
<div class="row" id="row"></div>
<pre class="ground" id="ground"></pre>
<div class="labels" id="labels"></div>
<script>
const W='#f1eee7',S='#e3e2dd',G='#aab0b9',D='#8a8f96',O='#eba078',B='#91bacb',V='#7f9ccf',F=['#d98a43','#eba078','#c4712f'],P='#c9a46a';
const L='#9aa8d8',U='#5b9dff',GL='#ffffff';
const ASTRO=[
  '     .-"""""-.',
  '   .\'  _____  \'.',
  '  /  .\'     \'.  \\',
  ' |  /  o      \\  |',
  ' | |   .       | |[]',
  ' |  \\         /  |[]',
  '  \\  \'._____.\'  /',
  '   \'._________.\'',
  '    /|  [o]  |\\',
  '   ( |_______| )',
  '     | |   | |',
  '     (__) (__)'];
const astroColor=(r,c,ch)=>(r===3&&ch==='o')||(r===4&&c===7)?GL:r>=1&&r<=6&&c>=4&&c<=14&&!(r===1&&(c<5||c>13))?L:ch==='['||ch===']'?G:r===8&&c===9?U:r===11?G:r>=8?S:W;
const designs=[
  {name:'Astronaut, walking',lines:ASTRO,alt:['      | | | |','      (__)(__)'],color:astroColor},
  {name:'Astronaut, floating',lines:ASTRO,color:astroColor,tilt:-12},
  {name:'Rover',
   lines:['       .--------.','      / .-.  .-. \\','     | ( o )( o ) |','      \\ \'-\'  \'-\' /  o','       \'---..---\'   !','   .-------||--------.','  /  [::]       [o]   \\','  |___________________|','   (@)     (@)     (@)'],
   color:(r,c,ch)=>r<=4&&c>=19?W:r<=4&&c<=18?((r>=1&&r<=3)&&c>=7&&c<=16?(ch==='o'?GL:G):O):r===5&&(c===11||c===12)?'#dcdcd6':r===6&&c>=5&&c<=8?(ch===':'?U:G):r===6&&c>=16&&c<=18?(ch==='o'?O:G):r===8?(ch==='@'?O:D):'#d6d7d3'},
  {name:'Lander',
   lines:['          o      .-.','          |     (   )','      .---\'-------\'-.','     /  .-.     .-.  \\','    |  ( o )   ( o )  |','    |   \'-\'     \'-\'   |','     \\_______________/','     |###############|','     |###############|H','     |###############|H','    /\'------\\_/------\'H\\','   /        /_\\       H \\','  /                   H  \\',' ==='+' '.repeat(18)+'=  ==='],
   color:(r,c,ch)=>ch==='#'?F[(c*7+r*3)%3]:ch==='H'?'#e8e4da':ch==='='?P:r<=1?W:r>=3&&r<=5&&c>=7&&c<=19?(ch==='o'?GL:L):r<=6?'#c9ccd1':r>=10&&c>=12&&c<=14?D:'#d8d6cf'},
];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const render=(pre,d,lines)=>{pre.innerHTML=lines.map((l,r)=>[...l].map((ch,c)=>ch===' '?' ':`<span style="color:${d.color(r,c,ch)}">${esc(ch)}</span>`).join('')).join('\n');};
for (const d of designs) {
  const pre=document.createElement('pre'); if (d.tilt) pre.style.transform=`rotate(${d.tilt}deg) translateY(-40px)`; document.getElementById('row').appendChild(pre); render(pre,d,d.lines);
  const lab=document.createElement('div'); lab.textContent=d.name; lab.style.width=pre.offsetWidth+'px'; lab.style.textAlign='center';
  document.getElementById('labels').appendChild(lab);
  if (d.alt) { let f=0; setInterval(()=>{ f^=1; render(pre,d,f?[...d.lines.slice(0,d.lines.length-d.alt.length),...d.alt]:d.lines); },450); }
}
document.getElementById('ground').textContent='_'.repeat(160)+'\n'+'#&8@B$%0#&8@aeous{}[]rcvxz=+'.repeat(7).slice(0,160);
</script>
</body>
</html>
