<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martwin · planet map (mockup)</title>
<style>
@font-face{font-family:'Geist Sans';font-weight:100 900;src:url('/fonts/geist-sans-latin.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Geist Mono';font-weight:100 900;src:url('/fonts/geist-mono-latin.woff2') format('woff2');font-display:swap}
:root{color-scheme:dark;--bg:#101214;--rule:#2a2e30;--text:#f1eee7;--muted:#aaa9a3;--dim:#6f716c;--mars:#eba078;--earth:#91bacb;--mono:'Geist Mono',ui-monospace,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'Geist Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--earth);outline-offset:3px}
.wrap{max-width:1400px;margin:0 auto;padding:28px 4vw 60px}

.track{font:14px/1.8 var(--mono);color:var(--dim);letter-spacing:.02em;margin:0 0 6px}
.track .done{color:var(--muted)}.track .now{color:var(--text)}.track .wire{padding:0 10px;color:#4b5052}
h1{font:400 clamp(20px,2.1vw,26px)/1.5 var(--mono);letter-spacing:-.01em;margin:0 0 20px}
h1 .m{color:var(--mars)}h1 .e{color:var(--earth)}h1 .vs{color:var(--dim);padding:0 .5em}

.stage{display:block;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.view{position:relative;height:600px;overflow:hidden}
#ascii{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#ascii:active{cursor:grabbing}

/* overlays: plain mono text */
.ov{position:absolute;z-index:3;font:12px var(--mono);color:var(--dim);text-shadow:0 0 8px #101214}
.planets{top:14px;right:18px}
.planets button{letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--dim)}.planets button.on{color:var(--text)}.planets button:hover{color:var(--mars)}
.planets .wire{padding:0 8px;color:#4b5052}
.hint{bottom:14px;left:18px;pointer-events:none}
.attr{bottom:14px;right:16px;font-size:10px}
.tip{position:absolute;z-index:4;pointer-events:none;font:12px/1.5 var(--mono);color:var(--text);background:#101214f0;padding:4px 8px;border-left:2px solid var(--mars);white-space:nowrap;transform:translate(12px,-50%)}
.tip.flip{transform:translate(calc(-100% - 12px),-50%);border-left:0;border-right:2px solid var(--mars)}

/* 3D compare: Mars | Earth, same scale */
.split{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--rule)}
.pane{position:relative;overflow:hidden;background:#101214}
.pane .map{position:absolute;inset:0}
.pane .map .maplibregl-canvas{filter:saturate(.85) contrast(1.04)}
.pane::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,#101214aa 100%)}
.label{position:absolute;top:14px;left:16px;right:16px;z-index:3;font:12px/1.5 var(--mono);text-shadow:0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 0 8px #000;pointer-events:none}
.label .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pattr{position:absolute;bottom:10px;z-index:3;font:10px var(--mono);color:#c9c7c0;text-shadow:0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 0 8px #000;pointer-events:none;white-space:nowrap}
#paneMars .pattr{left:12px}#paneEarth .pattr{right:12px}
.label .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.label .n{font-size:17px;color:var(--text);letter-spacing:-.01em}
#paneMars .k{color:var(--mars)}#paneEarth .k{color:var(--earth)}
.pload{position:absolute;inset:0;z-index:2;display:grid;place-items:center;font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);pointer-events:none}
.console{display:flex;align-items:center;gap:34px;flex-wrap:wrap;padding:10px 2px;border-top:1px solid var(--rule);font:12px var(--mono);color:var(--dim)}
.console .right{margin-left:auto}
.scale3d{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;padding:5px 12px;background:#101214d9;font:12px var(--mono);color:var(--text);white-space:nowrap}
.scale3d i{display:inline-block;height:6px;border:1px solid var(--text);border-top:0;vertical-align:middle;margin-right:8px}
.attr{text-shadow:0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 1px 0 #000,0 -1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 0 8px #000;color:#c9c7c0}
.console .grp{display:flex;align-items:center;gap:12px}
.console .lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#4b5052}
.console button{color:var(--muted)}.console button:hover{color:var(--mars)}.console button.on{color:var(--text)}
#pMars,#pEarth{letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.console .wire{color:#4b5052}
.console .status{flex:1;color:var(--muted)}
.console .status i{display:inline-block;height:6px;border:1px solid var(--text);border-top:0;vertical-align:middle;margin-right:8px}
.console .attr{font-size:10px}
.bar3d{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 16px;font:12px var(--mono);color:var(--muted);background:linear-gradient(transparent,#101214e0 45%)}
.bar3d button{color:var(--muted)}.bar3d button:hover{color:var(--mars)}
.bar3d .scale{color:var(--text)}
.bar3d .scale i{display:inline-block;height:6px;border:1px solid var(--text);border-top:0;vertical-align:middle;margin-right:8px}
.bar3d .attr3d{font-size:10px;color:var(--dim);text-align:right}

/* side */
.side{border-top:1px solid var(--rule);font:12px/1.6 var(--mono)}
.mside{padding:18px;display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:6px 40px;align-items:start}
.mside .exs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));column-gap:24px}
.mside .n{font-size:18px;color:var(--text)}
.mside .c{color:var(--mars);font-variant-numeric:tabular-nums;margin-bottom:22px}
.mside .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.mside .ex{display:block;width:100%;padding:8px 0;border-bottom:1px solid var(--rule);text-align:left;color:var(--muted)}
.mside .ex:hover,.mside .ex.on{color:var(--text)}.mside .ex.on::before{content:'› ';color:var(--mars)}
.go{margin-top:24px;color:var(--mars);font-size:13px}.go:hover{color:var(--text)}
.rows{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1100px){.rows{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.rows{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 8px;padding:12px 14px;border-bottom:1px solid var(--rule);cursor:pointer;color:var(--muted)}
.row:hover,.row.hot{background:#191c1e}
.row.sel{background:#16212a}
.row .r{color:var(--earth)}
.row .nm{color:var(--text);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sc{font-variant-numeric:tabular-nums}
.row .rg{grid-column:2/4;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:980px){.view{height:520px}.split{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.mside{grid-template-columns:1fr}.scale3d{top:50%;bottom:auto;transform:translate(-50%,-50%)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</div>

function fitEarth(){let la=SITES.map(s=>s.lat),lo=SITES.map(s=>s.lon),a=Math.min(...lo),b=Math.max(...lo),t=Math.max(...la),d=Math.min(...la);views.earth={lat:Math.max(-60,Math.min(60,(t+d)/2)),lon:(a+b)/2,zoom:Math.max(1,Math.min(8,300/Math.max(35,b-a),130/Math.max(25,t-d)))};}

/* ---------- side panel + title ---------- */
function header(){let T=$('title');T.replaceChildren();let sp=(cls,txt)=>{let e=document.createElement('span');e.className=cls;e.textContent=txt;return e;};
 if(mode==='3d')T.append(sp('m',target.name),sp('vs','vs'),sp('e',(sel||SITES[0]).name));
 else if(planet==='mars')T.append('Mars target · ',sp('m',target.name));
 else T.append(SITES.length+' Earth analogs for ',sp('m',target.name));}
function renderSide(){let ms=$('marsSide'),showMars=mode!=='3d'&&planet==='mars';ms.hidden=!showMars;$('rows').hidden=showMars;
 if(showMars){ms.replaceChildren();let mk=(tag,cls,txt)=>{let e=document.createElement(tag);e.className=cls;if(txt!=null)e.textContent=txt;return e;};
  let left=mk('div',''),right=mk('div',''),exs=mk('div','exs');left.append(mk('div','n',target.name),mk('div','c',fmtLL(target)));
  let go=mk('button','go','compare with top Earth match →');go.style.marginTop='0';go.onclick=()=>open3d(null);left.append(go);
  for(let ex of MARS_EXAMPLES){let b=mk('button','ex'+(ex.name===target.name?' on':''),ex.name);b.onclick=()=>{target={...ex};view=views.mars={lat:ex.lat,lon:ex.lon,zoom:Math.max(view.zoom,2.5)};renderSide();header();draw();};exs.append(b);}
  right.append(mk('div','k','examples'),exs);ms.append(left,right);return;}
 $('rows').replaceChildren(...SITES.map(s=>{let li=document.createElement('li');li.className='row'+(s===sel?' sel':'');li.dataset.rank=s.rank;li.tabIndex=0;
  li.innerHTML='<span class="r">'+String(s.rank).padStart(2,'0')+'</span><span class="nm"></span><span class="sc">'+s.score.toFixed(2)+'</span><span class="rg"></span>';
  li.querySelector('.nm').textContent=s.name;li.querySelector('.rg').textContent=s.region;
  li.onmouseenter=()=>{if(mode!=='3d')setHot(s);preload();};li.onmouseleave=()=>{if(mode!=='3d')setHot(null);};
  li.onclick=()=>open3d(s);li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open3d(s);}};return li;}));}
function setPlanet(p){planet=p;view=views[p];hot=null;showTip(null);
 $('pMars').className=p==='mars'?'on':'';$('pEarth').className=p==='earth'?'on':'';$('pMars').setAttribute('aria-pressed',p==='mars');$('pEarth').setAttribute('aria-pressed',p==='earth');
 $('attr').textContent=p==='mars'?'NASA MOLA':'Esri · Natural Earth';
 $('ascii').setAttribute('aria-label',p==='mars'?'Mars elevation map with the target pin. Double-click to move the target; click the pin to compare in 3D.':'Earth map with match pins. Click a pin to compare it with the Mars target in 3D.');
 renderSide();header();draw();}
$('pMars').onclick=()=>setPlanet('mars');$('pEarth').onclick=()=>setPlanet('earth');

let mlPromise=null;
const maps={earth:null,mars:null},markers={earth:null,mars:null},maxZ={},K_MARS=3396190/6378137; // Mars/Earth radius: MapLibre measures in Earth metres
const MOLA_MIN=-8430,MOLA_MAX=9700; // Trek 8-bit MOLA stretch, fitted to Hellas floor (~-7.15 km) and Jezero floor (~-2.6 km); ~71 m per level, volcano summits clip
function preload(){if(mlPromise)return mlPromise;mlPromise=new Promise((res,rej)=>{let l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css';document.head.append(l);let s=document.createElement('script');s.src='https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js';s.onload=()=>{registerMars(window.maplibregl);res(window.maplibregl);};s.onerror=()=>{mlPromise=null;rej(Error('MapLibre failed to load'));};document.head.append(s);});return mlPromise;}
const SKY={'sky-color':'#101214','horizon-color':'#1e2a30','fog-color':'#101214','sky-horizon-blend':.6,'horizon-fog-blend':.6,'fog-ground-blend':.4};
const EARTH_STYLE={version:8,sources:{
 img:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,attribution:'Esri, Maxar, Earthstar Geographics'},
 dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,encoding:'terrarium',maxzoom:15},
 hs:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,encoding:'terrarium',maxzoom:15}},
 layers:[{id:'bg',type:'background',paint:{'background-color':'#101214'}},{id:'img',type:'raster',source:'img',paint:{'raster-saturation':-.15,'raster-contrast':.08}},{id:'hs',type:'hillshade',source:'hs',paint:{'hillshade-shadow-color':'#101214','hillshade-highlight-color':'#f1eee7','hillshade-exaggeration':.35}}],
 terrain:{source:'dem',exaggeration:1.6},sky:SKY};
const MARS_STYLE={version:8,sources:{
 ctx:{type:'raster',tiles:['marsimg://ctx/{z}/{x}/{y}'],tileSize:256,maxzoom:14},
 hirise:{type:'raster',tiles:['marsimg://hirise/{z}/{x}/{y}'],tileSize:256,minzoom:13,maxzoom:19},
 dem:{type:'raster-dem',tiles:['marsdem://{z}/{x}/{y}'],tileSize:256,encoding:'terrarium',maxzoom:9},
 hs:{type:'raster-dem',tiles:['marsdem://{z}/{x}/{y}'],tileSize:256,encoding:'terrarium',maxzoom:9}},
 layers:[{id:'bg',type:'background',paint:{'background-color':'#1a1210'}},{id:'ctx',type:'raster',source:'ctx'},{id:'hirise',type:'raster',source:'hirise',minzoom:14},{id:'hs',type:'hillshade',source:'hs',paint:{'hillshade-shadow-color':'#101214','hillshade-highlight-color':'#f1eee7','hillshade-exaggeration':.25}}],
 terrain:{source:'dem',exaggeration:1.6},sky:{...SKY,'horizon-color':'#2a1d18'}};

/* Mars tiles are geographic (lat/lon grid); MapLibre wants Web Mercator, so each tile is rebuilt row by row. */
const GEO={ctx:{url:(L,r,c)=>`https://astro.arcgis.com/arcgis/rest/services/OnMars/CTX/MapServer/tile/${L}/${r}/${c}`,max:12,size:512},
 hirise:{url:(L,r,c)=>`https://astro.arcgis.com/arcgis/rest/services/OnMars/HiRISE/MapServer/tile/${L}/${r}/${c}`,max:17,size:512},
 mola:{url:(L,r,c)=>`https://trek.nasa.gov/tiles/Mars/EQ/mola128_mola64_merge_90Nto90S_SimpleC_clon0/1.0.0/default/default028mm/${L}/${r}/${c}.png`,max:5,size:256}};
const merc2lat=t=>Math.atan(Math.sinh(Math.PI*(1-2*t)))*180/Math.PI;
const imgCache=new Map();
function geoTile(src,L,r,c,signal){let k=src+L+'/'+r+'/'+c;if(!imgCache.has(k))imgCache.set(k,fetch(GEO[src].url(L,r,c),{signal}).then(x=>x.ok?x.blob():null).then(b=>b?createImageBitmap(b):null).catch(()=>{imgCache.delete(k);return null;}));return imgCache.get(k);}
async function geoMosaic(src,z,x,y,signal){
 let n=2**z,lonW=x/n*360-180,lonE=(x+1)/n*360-180,latN=merc2lat(y/n),latS=merc2lat((y+1)/n),G=GEO[src];
 let L=Math.max(0,Math.min(G.max,Math.round(Math.log2(180*256/(G.size*(lonE-lonW)))))),td=180/2**L;
 let c0=Math.floor((lonW+180)/td),c1=Math.floor((lonE+180-1e-9)/td),r0=Math.floor((90-latN)/td),r1=Math.min(2**L-1,Math.floor((90-latS-1e-9)/td));
 let tiles=[];for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)tiles.push(geoTile(src,L,r,c,signal).then(b=>({r,c,b})));
 let got=await Promise.all(tiles);if(!got.some(t=>t.b))return null;
 let S=G.size,m=new OffscreenCanvas((c1-c0+1)*S,(r1-r0+1)*S),mc=m.getContext('2d');for(let t of got)if(t.b)mc.drawImage(t.b,(t.c-c0)*S,(t.r-r0)*S,S,S);
 return {m,lonW,lonE,n,y,c0,r0,td,S};}
function rowMap(M,py){let lat=merc2lat((M.y+(py+.5)/256)/M.n);return ((90-lat)-M.r0*M.td)/M.td*M.S;}
const EMPTY=(async()=>new OffscreenCanvas(1,1))();
async function pngOf(cv){return await (await cv.convertToBlob({type:'image/png'})).arrayBuffer();}
function registerMars(ml){
 ml.addProtocol('marsimg',async(p,ac)=>{let [src,z,x,y]=p.url.replace('marsimg://','').split('/');z=+z;x=+x;y=+y;
  let M=await geoMosaic(src,z,x,y,ac.signal),o=new OffscreenCanvas(256,256),c=o.getContext('2d');if(!M)return {data:await pngOf(o)};
  let sx=((M.lonW+180)-M.c0*M.td)/M.td*M.S,sw=(M.lonE-M.lonW)/M.td*M.S;
  for(let py=0;py<256;py++)c.drawImage(M.m,sx,rowMap(M,py),sw,1,0,py,256,1);
  let d=c.getImageData(0,0,256,256),a=d.data;let nod=src==='hirise';for(let i=0;i<a.length;i+=4){let g=a[i];if(nod&&g<4){a[i+3]=0;continue;}a[i]=Math.min(255,g*1.02+10);a[i+1]=g*.74+4;a[i+2]=g*.56;} // greyscale -> Mars tint
  c.putImageData(d,0,0);return {data:await pngOf(o)};});
 ml.addProtocol('marsdem',async(p,ac)=>{let [z,x,y]=p.url.replace('marsdem://','').split('/').map(Number);
  let M=await geoMosaic('mola',z,x,y,ac.signal),o=new OffscreenCanvas(256,256),c=o.getContext('2d'),out=c.createImageData(256,256),a=out.data;
  let W=M?M.m.width:1,H=M?M.m.height:1,src=M?M.m.getContext('2d').getImageData(0,0,W,H).data:null,f=new Float32Array(W*H);
  if(src){for(let i=0;i<W*H;i++)f[i]=src[i*4];for(let pass=0;pass<2;pass++){let g=new Float32Array(f);for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){let s=0,n=0;for(let k=-2;k<=2;k++){let X=xx+k;if(X>=0&&X<W){s+=g[yy*W+X];n++;}}f[yy*W+xx]=s/n;}g=new Float32Array(f);for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){let s=0,n=0;for(let k=-2;k<=2;k++){let Y=yy+k;if(Y>=0&&Y<H){s+=g[Y*W+xx];n++;}}f[yy*W+xx]=s/n;}}}
  let sx0=M?((M.lonW+180)-M.c0*M.td)/M.td*M.S:0,sw=M?(M.lonE-M.lonW)/M.td*M.S:0;
  for(let py=0;py<256;py++){let sy=M?rowMap(M,py):0;for(let px=0;px<256;px++){let g=0;if(M){let fx=Math.max(0,Math.min(W-1.001,sx0+(px+.5)/256*sw-.5)),fy=Math.max(0,Math.min(H-1.001,sy-.5)),ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,i=iy*W+ix;g=(f[i]*(1-tx)+f[i+1]*tx)*(1-ty)+(f[i+W]*(1-tx)+f[i+W+1]*tx)*ty;}
   let v=(MOLA_MIN+g/255*(MOLA_MAX-MOLA_MIN))/K_MARS+32768,k=(py*256+px)*4;a[k]=v/256|0;a[k+1]=(v|0)%256;a[k+2]=(v%1)*256|0;a[k+3]=255;}}
  c.putImageData(out,0,0);return {data:await pngOf(o)};});
}

/* sharpest-imagery limits, so the camera never zooms into placeholder tiles */
async function earthMaxZoom(s){let k='e'+s.lat+','+s.lon;if(maxZ[k])return maxZ[k];
 let zs=[19,18,17,16,15],ok=await Promise.all(zs.map(z=>{let n=2**z,x=Math.floor((s.lon+180)/360*n),y=Math.floor((1-Math.asinh(Math.tan(s.lat*Math.PI/180))/Math.PI)/2*n);
  return fetch(`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tilemap/${z}/${y-3}/${x-3}/7/7?f=json`).then(r=>r.json()).then(j=>Array.isArray(j.data)&&j.data.every(v=>v===1)).catch(()=>false);}));
 let top=zs.find((z,i)=>ok[i])||15;return maxZ[k]={tile:top,zoom:top-.55,src:top>=18?'Esri ~0.3–0.5 m':top>=17?'Esri ~1 m':'Esri ~2 m+'};}
async function marsMaxZoom(t){let k='m'+t.lat+','+t.lon;if(maxZ[k])return maxZ[k];let L=16,td=180/2**L;
 let has=await fetch(GEO.hirise.url(L,Math.floor((90-t.lat)/td),Math.floor((t.lon+180)/td))).then(r=>r.ok).catch(()=>false);
 return maxZ[k]=has?{tile:19,zoom:18.4,src:'HiRISE ~0.3 m'}:{tile:14,zoom:13.45,src:'CTX ~5 m'};}


function setEarthImageryMax(m,z){let apply=()=>{let src=m.getSource('img');if(!src||src._siteMax===z)return;let lyr=EARTH_STYLE.layers.find(l=>l.id==='img');m.removeLayer('img');m.removeSource('img');m.addSource('img',{...EARTH_STYLE.sources.img,maxzoom:z});m.addLayer(lyr,'hs');m.getSource('img')._siteMax=z;};m.isStyleLoaded()?apply():m.once('load',apply);}

/* ---------- 3D compare: Mars | Earth side by side, same scale, cameras linked ---------- */
const P={mars:{el:'mapMars',load:'loadMars',style:()=>MARS_STYLE,k:K_MARS,col:'#eba078'},earth:{el:'mapEarth',load:'loadEarth',style:()=>EARTH_STYLE,k:1,col:'#eba078'}};
const site=p=>p==='mars'?target:(sel||SITES[0]);
const paneW=p=>$(P[p].el).clientWidth||450;
const zoomFor=(p,metres)=>Math.log2(78271.517*Math.cos(site(p).lat*Math.PI/180)*P[p].k*paneW(p)/metres);
const metresAt=(p,z)=>78271.517*Math.cos(site(p).lat*Math.PI/180)*P[p].k*paneW(p)/2**z;
let syncing=false,orbitRaf=0,limits={},gen=0,camMode='top';
const CAMS={top:{pitch:0,bearing:0},tilt:{pitch:55,bearing:-20}};
function camButtons(){$('camTop').className=camMode==='top'?'on':'';$('camTilt').className=camMode==='tilt'?'on':'';$('camTop').setAttribute('aria-pressed',camMode==='top');$('camTilt').setAttribute('aria-pressed',camMode==='tilt');}
function setCam(c){camMode=c;camButtons();let m=maps.mars;if(m&&mode==='3d'){let o=!!orbitRaf;stopOrbit();m.easeTo({pitch:CAMS[c].pitch,bearing:CAMS[c].bearing,duration:reduced?0:600});if(o)m.once('moveend',startOrbit);}}
function syncFrom(p){if(syncing)return;let q=p==='mars'?'earth':'mars',A=maps[p],B=maps[q];if(!A||!B)return;syncing=true;B.jumpTo({zoom:zoomFor(q,metresAt(p,A.getZoom())),pitch:A.getPitch(),bearing:A.getBearing()});syncing=false;scaleBar();}
function scaleBar(){let m=maps.mars||maps.earth;if(!m)return;let p=maps.mars?'mars':'earth',mpp=metresAt(p,m.getZoom())/paneW(p),opts=[25,50,100,250,500,1000,2000,5000,10000,25000],v=opts.find(o=>o/mpp>=60)||opts.at(-1);
 if(mode==='3d')$('scale3d').innerHTML='<i style="width:'+Math.round(v/mpp)+'px"></i>'+(v>=1000?v/1000+' km':v+' m')+' · same scale';}
function stopOrbit(){cancelAnimationFrame(orbitRaf);orbitRaf=0;if($('orbit')){$('orbit').textContent='orbit: off';$('orbit').setAttribute('aria-pressed','false');$('orbit').classList.remove('on');}}
function setOrbit(on){on?startOrbit():stopOrbit();}
function startOrbit(){stopOrbit();if(!maps.mars)return;$('orbit').textContent='orbit: on';$('orbit').setAttribute('aria-pressed','true');$('orbit').classList.add('on');let last=performance.now();(function spin(now){let m=maps.mars;m.setBearing(m.getBearing()+(now-last)*.004);last=now;orbitRaf=requestAnimationFrame(spin);})(last);}
async function open3d(s){
 if(s)sel=s;else sel=sel||SITES[0];
 let keep=mode==='3d'&&maps.mars?{metres:metresAt('mars',maps.mars.getZoom()),pitch:maps.mars.getPitch(),bearing:maps.mars.getBearing()}:{metres:1000,...CAMS[camMode]};
 mode='3d';stopOrbit();hot=null;showTip(null);let my=++gen;
 $('split').hidden=false;$('gPlanet').hidden=true;$('gBack').hidden=$('gCam').hidden=$('orbit').hidden=false;camButtons();setOrbit(false);$('attr').hidden=true;
 $('nameMars').textContent=target.name;$('nameEarth').textContent=sel.name;$('kEarth').textContent='earth · match '+String(sel.rank).padStart(2,'0')+' · '+sel.score.toFixed(2);
 renderSide();header();
 ['mars','earth'].forEach(p=>{$(P[p].load).hidden=false;markers[p]?.remove();markers[p]=null;});
 let ml,lm,le;try{[ml,lm,le]=await Promise.all([preload(),marsMaxZoom(target),earthMaxZoom(sel)]);}catch(err){$('loadMars').textContent=$('loadEarth').textContent='3d needs an internet connection';return;}
 if(my!==gen)return;
 limits={mars:lm,earth:le};
 // one shared closest scale: whichever planet's imagery runs out first sets it for both
 let floor=Math.max(metresAt('mars',lm.zoom),metresAt('earth',le.zoom)),metres=Math.max(keep.metres,floor);
 for(let p of ['mars','earth']){let s=site(p),cam={center:[s.lon,s.lat],zoom:zoomFor(p,metres),pitch:keep.pitch,bearing:keep.bearing},mz=zoomFor(p,floor)+.001,m=maps[p];
  if(!m){m=maps[p]=new ml.Map({container:P[p].el,style:P[p].style(),...cam,maxZoom:mz,maxPitch:80,attributionControl:false,fadeDuration:0});
   m.on('move',()=>syncFrom(p));['dragstart','wheel','touchstart','mousedown'].forEach(ev=>m.on(ev,stopOrbit));}
  else{m.setMaxZoom(mz);m.resize();m.jumpTo(cam);}
  if(p==='earth')setEarthImageryMax(m,le.tile);
  let done=false,ready=()=>{if(done||my!==gen)return;done=true;$(P[p].load).hidden=true;markers[p]=new ml.Marker({element:pinEl(P[p].col)}).setLngLat([s.lon,s.lat]).addTo(m);};
  m.once('idle',ready);setTimeout(ready,15000);}
 scaleBar();}
function pinEl(col){let el=document.createElement('div');el.style.cssText=`width:12px;height:12px;border-radius:50%;background:${col};border:2px solid #101214;box-shadow:0 0 0 1px ${col}66,0 0 10px ${col}aa`;return el;}
function back(){if(mode!=='3d')return;gen++;stopOrbit();mode='map';$('split').hidden=true;$('gPlanet').hidden=false;$('gBack').hidden=$('gCam').hidden=$('orbit').hidden=true;$('attr').hidden=false;setPlanet(planet);$('ascii').focus({preventScroll:true});}
$('back').onclick=back;$('camTop').onclick=()=>setCam('top');$('camTilt').onclick=()=>setCam('tilt');$('orbit').onclick=()=>setOrbit(!orbitRaf);
$('zin').onclick=()=>zoomBy(1.4);$('zout').onclick=()=>zoomBy(1/1.4);
function zoomBy(f){if(mode==='3d'){let m=maps.mars||maps.earth;if(m){stopOrbit();m.easeTo({zoom:m.getZoom()+Math.log2(f),duration:reduced?0:250});}return;}view.zoom=Math.max(1,Math.min(12,view.zoom*f));draw();}
addEventListener('keydown',e=>{if(e.key==='Escape')back();});
addEventListener('resize',()=>{if(mode!=='3d')draw();else scaleBar();});

fitEarth();setPlanet(planet);document.fonts?.ready.then(draw);
</script>
