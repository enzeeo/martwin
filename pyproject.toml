[project]
name = "guardians-deploy"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
# Serving: the INDUS encoder runs through ONNX Runtime, no PyTorch.
indus = [
    "huggingface-hub>=0.30,<3",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
]
# One-off export of the pinned encoder (tools/export_encoder_onnx.py).
# Transformers is pinned because it decides how the tokenizer is built.
export = [
    "numpy>=1.26,<3",
    "onnx>=1.17,<2",
    "torch==2.9.1",
    "transformers==5.23.0",
]
dev = ["httpx>=0.28,<1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
